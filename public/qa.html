<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pocket Cube · viewport QA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e8e2;color:#253c35;font:14px system-ui,sans-serif}header{padding:12px 18px;background:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1}strong{font-size:14px}button,a{font:inherit;min-height:44px;padding:11px 14px;border:1px solid #cbd5cc;border-radius:8px;background:white;color:inherit;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#253c35;color:#fff;border-color:#253c35}p{margin:0;font-size:11px;color:#617368}main{display:grid;justify-content:center;padding:16px;overflow:auto}iframe{display:block;width:390px;height:844px;border:0;background:#f5f3eb;box-shadow:0 3px 20px #233c351f}output{font-size:12px;font-variant-numeric:tabular-nums}button:focus-visible,a:focus-visible{outline:3px solid #e7805d;outline-offset:2px}
</style>
</head>
<body>
<header>
<strong>Pocket Cube · 表示確認</strong>
<button data-width="390" data-height="844" aria-pressed="true">390 × 844</button>
<button data-width="320" data-height="568" aria-pressed="false">320 × 568</button>
<button data-width="844" data-height="390" aria-pressed="false">844 × 390</button>
<output id="size">390 × 844 CSS px</output>
<a href="./">ゲームを直接開く</a>
<p>実際のゲームを同じページ内に表示します。実機・Safari・タッチ性能の検証ではありません。</p>
</header>
<main><iframe id="game" src="./" title="ポケットキューブの実際のゲーム画面" width="390" height="844"></iframe></main>
<script>
const frame=document.getElementById('game');
for(const button of document.querySelectorAll('button[data-width]'))button.addEventListener('click',()=>{
 const width=Number(button.dataset.width),height=Number(button.dataset.height);
 frame.style.width=width+'px';frame.style.height=height+'px';frame.width=String(width);frame.height=String(height);
 document.getElementById('size').textContent=width+' × '+height+' CSS px';
 for(const other of document.querySelectorAll('button[data-width]'))other.setAttribute('aria-pressed',String(other===button));
});
</script>
</body>
</html>
